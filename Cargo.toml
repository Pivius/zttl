[package]
name = "zttl"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
image = "0.25.10"
palette = "0.7.7"
petgraph = "0.8.3"
pulldown-cmark = "0.13.4"
